<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>X One Click Block</title>
</head>
<body>
  <header><span class="mark">X</span><div><strong>One Click Block</strong><small id="viewer">本地控制</small></div></header>
  <div class="stats">
    <div><strong id="blocked">0</strong><span>已拉黑</span></div>
    <div><strong id="muted">0</strong><span>已静音</span></div>
    <div><strong id="pending">0</strong><span>队列中</span></div>
  </div>
  <button id="open-options">打开控制中心</button>
  <p>访问 X 后，扩展会在推文和用户旁显示一键按钮。</p>
  <script src="../shared/core.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
